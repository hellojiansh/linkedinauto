<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brandstorm Opener</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        width: 260px;
      }

      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }

      button {
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      button:active {
        transform: translateY(1px);
      }

      p {
        margin: 10px 0 0;
        color: #4b5563;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Automation base</h1>
    <button id="start">Start</button>
    <p>Opens https://brandstorm.loreal.com/en in a new tab.</p>

    <script src="popup.js"></script>
  </body>
</html>
